
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow | Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CampusFlow 🎓</h1>
        <p>Your student life, organized.</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome, Student!</h2>
            <p>Small steps every day lead to big achievements.</p>
        </section>

        <section class="dashboard">
            <div class="card">
                <h3>📚 Study Time</h3>
                <p>Make time to learn something new today.</p>
            </div>

            <div class="card">
                <h3>🎯 My Tasks</h3>
                <p id="task-count">0 tasks remaining</p>
            </div>
        </section>

        <section class="task-section">
            <h2>My To-Do List</h2>

            <form id="task-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Enter a task..."
                    required
                >
                <button type="submit">Add Task</button>
            </form>

            <ul id="task-list"></ul>
        </section>
    </main>

    <footer>
        <p>Created by a Computing Student | 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
